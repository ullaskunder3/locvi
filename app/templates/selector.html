<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>LocVi</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='root.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='selector.css') }}">
</head>

<body class="container">
  <div id="box">
    <h3>Select Workspace Folder</h3>

    <div class="browse-action-area">
      <button id="browseBtn" type="button" class="btn-primary-large">
        📁 Browse System Folder
      </button>
    </div>

    {% if pinned_folders %}
    <div class="folder-section">
      <p class="section-title">📌 Pinned Folders:</p>
      <ul class="folder-list">
        {% for f in pinned_folders %}
        <li><a href="/use_folder?folder={{ f|urlencode }}" class="folder-link">📌 {{ f }}</a></li>
        {% endfor %}
      </ul>
    </div>
    {% endif %}

    {% if recent_folders %}
    <div class="folder-section">
      <p class="section-title">🕒 Recent Folders:</p>
      <ul class="folder-list">
        {% for f in recent_folders %}
        <li><a href="/use_folder?folder={{ f|urlencode }}" class="folder-link">📂 {{ f }}</a></li>
        {% endfor %}
      </ul>
    </div>
    {% endif %}

    <hr>
    <form action="/set_folder" method="post" class="manual-path-form">
      <input type="text" name="folder" id="folderInput" placeholder="Or enter full folder path..." required>
      <button type="submit" class="btn-secondary">Open</button>
    </form>
  </div>

  <script>
    document.getElementById("browseBtn")?.addEventListener("click", async () => {
      try {
        const res = await fetch("/browse_folder", { method: "POST" });
        const data = await res.json();
        if (data.success) {
          window.location.href = "/";
        } else {
          // Fallback to HTML5 directory picker if native window dialog isn't available
          if ('showDirectoryPicker' in window) {
            const handle = await window.showDirectoryPicker();
            if (handle && handle.name) {
              alert("Selected: " + handle.name + "\n(For full path access, paste path below or use desktop app window)");
            }
          } else {
            alert(data.message || "Please enter the folder path below.");
          }
        }
      } catch (err) {
        console.error(err);
      }
    });
  </script>
</body>

</html>
